  <!-- Ionicons -->

  <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>

  <!-- アクティブ切り替え & 表示制御 -->
  <script>
    const list = document.querySelectorAll(".main-menu .list:not(.search)");
    const classroomContent = document.getElementById("classroom-content");

    function activeLink() {
      list.forEach((item) => item.classList.remove("active"));
      this.classList.add("active");

      const title = this.querySelector(".title").textContent;
      if (title === "トップ") {
        classroomContent.style.display = "block";
      } else {
        classroomContent.style.display = "none";
      }
    }

    list.forEach((item) => {
      item.addEventListener("click", activeLink);
    });

    classroomContent.style.display = "block";

    const hamburgerBtn = document.getElementById("hamburger-btn");
    const floorList = document.getElementById("floor-list");
    hamburgerBtn.addEventListener("click", () => {
      floorList.classList.toggle("hidden");
    });

    const floorButtons = document.querySelectorAll(".floor-option");
    const floorContents = document.querySelectorAll(".floor-content");

    floorButtons.forEach((btn) => {
      btn.addEventListener("click", () => {
        const selectedFloor = btn.textContent;
        floorContents.forEach((content) => {
          if (content.id === `floor-${selectedFloor}`) {
            content.classList.add("active");
          } else {
            content.classList.remove("active");
          }
        });
        floorList.classList.add("hidden");
      });
    });
  </script>
