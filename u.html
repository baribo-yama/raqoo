<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>501予約一覧</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #f4f4f4;
      padding: 40px;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background-color: #fff;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }

    th, td {
      padding: 16px;
      text-align: center;
      border-bottom: 1px solid #ccc;
      font-size: 18px;
    }

    th {
      background-color: #5b2a82;
      color: white;
    }

    .reserve-button {
      background-color: #5b2a82;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }

    .reserve-button:hover {
      background-color: #7e3da9;
    }

    /* モーダル */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(0, 0, 0, 0.4);
    }

    .modal-content {
      background-color: #fff;
      margin: 10% auto;
      padding: 20px;
      border: 1px solid #888;
      width: 90%;
      max-width: 600px;
      border-radius: 10px;
    }

    .close {
      color: #aaa;
      float: right;
      font-size: 28px;
      font-weight: bold;
      cursor: pointer;
    }

    .close:hover,
    .close:focus {
      color: black;
      text-decoration: none;
    }

    .reservation-table th, .reservation-table td {
      font-size: 16px;
    }
  </style>
</head>
<body>

  <h1>5階 教室一覧</h1>
  <table>
    <tr>
      <th>教室</th>
      <th>備品</th>
      <th>予約一覧</th>
    </tr>
    <tr>
      <td>501</td>
      <td>内容変更可</td>
      <td><button class="reserve-button" onclick="openModal()">予約</button></td>
    </tr>
    <tr>
      <td>502</td>
      <td></td>
      <td><button class="reserve-button">予約</button></td>
    </tr>
    <tr>
      <td>503</td>
      <td></td>
      <td><button class="reserve-button">予約</button></td>
    </tr>
    <tr>
      <td>504</td>
      <td></td>
      <td><button class="reserve-button">予約</button></td>
    </tr>
  </table>

  <!-- モーダル -->
  <div id="reservationModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeModal()">&times;</span>
      <h2>501への予約申請</h2>
      <table class="reservation-table">
        <tr>
          <th>時間</th>
          <th>氏名</th>
          <th>人数</th>
        </tr>
        <tr>
          <td>10:50</td>
          <td>山崎（〜学科）</td>
          <td>13人</td>
        </tr>
        <tr>
          <td>11:00</td>
          <td>田中（〜学科）</td>
          <td>7人</td>
        </tr>
      </table>
    </div>
  </div>

  <script>
    function openModal() {
      document.getElementById("reservationModal").style.display = "block";
    }

    function closeModal() {
      document.getElementById("reservationModal").style.display = "none";
    }

    window.onclick = function(event) {
      const modal = document.getElementById("reservationModal");
      if (event.target == modal) {
        modal.style.display = "none";
      }
    };
  </script>

</body>
</html>
